version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    ignore:
      # @astrojs/check 0.9.10 peers typescript ^5.0.0 || ^6.0.0, so TS 7 fails
      # npm ci outright. Lift this when a release widens that range.
      - dependency-name: typescript
        versions:
          - ">=7"

    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
