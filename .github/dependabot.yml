version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      dev-tooling:
        dependency-type: development
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
